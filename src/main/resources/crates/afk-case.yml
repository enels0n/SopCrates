displayName: "<color:#1A989E><bold>ᴀꜰᴋ ᴄᴀꜱᴇ</bold></color> <color:#555555>(</color><color:#1A729E>%page%</color><color:#555555>/</color><color:#1A729E>%pages%</color><color:#555555>)</color>" #inventory

#if the player have no key
denyCommands:
  - "[console] abroadcast player %player_name% [minimessage] <color:#EEDAB0>❣ ###alocales_holo-survival_case-need-key-1### </color><color:#1A989E><bold>ᴀꜰᴋ ᴄᴀꜱᴇ</bold></color><color:#EEDAB0> ###alocales_holo-survival_case-need-key-2###</color>"
denyPush: true

#if the case is already opening
denyOpeningCommands:
  - "[console] abroadcast player %player_name% [minimessage] <color:#EEDAB0>┃ <bold>Этот кейс уже открывается!</bold></color>"
denyOpeningPush: false

key:
  name: "<color:#1A989E><bold>ᴀꜰᴋ ᴄᴀꜱᴇ</bold></color> <color:#35D6DE>ᴋᴇʏ</color>"
  lore:
    - ""
    - "<gray>┃ ###alocales_survival-items_case-key-lore-1### </gray><color:#1A989E><bold>ᴀꜰᴋ ᴄᴀꜱᴇ</bold></color><gray>###alocales_survival-items_case-key-lore-2###</gray>"
    - ""
  item: TRIPWIRE_HOOK
  model: 1005

keyType: key
spin:
  duration: 5.5s
  offset:
    x: 0.0
    y: 0.95
    z: 0.0

hologram:
  enabled: false
  hideWhileSpinning: true
  offset:
    x: 0.0
    y: 1.85
    z: 0.0

firework:
  offset:
    x: 0.0
    y: 0.7
    z: 0.0

open_commands: []

