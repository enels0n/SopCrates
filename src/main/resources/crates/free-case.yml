displayName: "<color:#35D6DE>ᴄᴀꜱᴇ</color> <gradient:#6944C1:#8B5CF6><bold>/ꜰʀᴇᴇ</bold></gradient> <color:#555555>(</color><color:#1A729E>%page%</color><color:#555555>/</color><color:#1A729E>%pages%</color><color:#555555>)</color>" #inventory

#if the player have no key
denyCommands:
  - "[console] abroadcast player %player_name% [minimessage] <color:#EEDAB0>❣ ###alocales_holo-survival_case-need-key-1### </color><color:#35D6DE>ᴄᴀꜱᴇ</color> <gradient:#6944C1:#8B5CF6><bold>/ꜰʀᴇᴇ</bold></gradient><color:#EEDAB0> ###alocales_holo-survival_case-need-key-2###</color>"
denyPush: true

#if the case is already opening
denyOpeningCommands:
  - "[console] abroadcast player %player_name% [minimessage] <color:#EEDAB0>┃ <bold>Этот кейс уже открывается!</bold></color>"
denyOpeningPush: false

key:
  name: "<color:#35D6DE>ᴄᴀꜱᴇ</color> <gradient:#6944C1:#8B5CF6><bold>/ꜰʀᴇᴇ</bold></gradient> <color:#35D6DE>ᴋᴇʏ</color>"
  lore:
    - ""
    - "<gray>┃ ###alocales_survival-items_case-key-lore-1### </gray><color:#35D6DE>ᴄᴀꜱᴇ</color> <gradient:#6944C1:#8B5CF6><bold>/ꜰʀᴇᴇ</bold></gradient><gray> ###alocales_survival-items_case-key-lore-2###</gray>"
    - ""
  item: TRIPWIRE_HOOK
  model: 1005

keyType: key
spin:
  duration: 5.0s
  offset:
    x: 0.0
    y: 1.0
    z: 0.0

hologram:
  enabled: true
  hideWhileSpinning: true
  offset:
    x: 0.0
    y: 0.7
    z: 0.0
  lines:
    - "&f左 %alocales_holo-survival_case-left-click%"
    - "&f右 %alocales_holo-survival_case-right-click%"
    - "<color:#35D6DE>ᴄᴀꜱᴇ</color> <gradient:#6944C1:#8B5CF6><bold>/ꜰʀᴇᴇ</bold></gradient>"

firework:
  offset:
    x: 0.0
    y: 1.1
    z: 0.0

open_commands: []

