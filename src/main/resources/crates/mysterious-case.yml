displayName: "<#DB00CA><bold>ᴍʏꜱᴛᴇʀɪᴏᴜꜱ ᴄᴀꜱᴇ <color:#555555>(</color><color:#1A729E>%page%</color><color:#555555>/</color><color:#1A729E>%pages%</color><color:#555555>)</color>" #inventory

#if the player have no key
denyCommands:
  - "[console] abroadcast player %player_name% %acolor_<#EEDAB0>%❣ ###alocales_cases_message-need-key-1### %acolor_<#DB00CA>%&lᴍʏꜱᴛᴇʀɪᴏᴜꜱ ᴄᴀꜱᴇ%acolor_<#EEDAB0>% ###alocales_cases_message-need-key-2###"
denyPush: true

#if the case is already opening
denyOpeningCommands:
  - "[console] abroadcast player %player_name% %acolor_<#EEDAB0>%┃ &l###alocales_cases_message-already-opening###"
denyOpeningPush: false

key:
  name: "<#DB00CA><bold>ᴍʏꜱᴛᴇʀɪᴏᴜꜱ ᴄᴀꜱᴇ <#35D6DE>ᴋᴇʏ"
  lore:
    - ""
    - "&7┃ ###alocales_cases_key-lore-1### <#DB00CA><bold>ᴍʏꜱᴛᴇʀɪᴏᴜꜱ ᴄᴀꜱᴇ&7###alocales_cases_key-lore-2###"
    - ""
  item: TRIPWIRE_HOOK
  model: 1101

keyType: key
spin:
  duration: 5.5s
  offset:
    x: 0.0
    y: 0.95
    z: 0.0

holograms:
  main:
    enabled: true
    hideWhileSpinning: true
    offset:
      x: 0.0
      y: 1.85
      z: 0.0
    lines:
      - "&fЛКМ: открыть кейс"
      - "&fПКМ: предпросмотр"
      - "<#DB00CA><bold>ᴍʏꜱᴛᴇʀɪᴏᴜꜱ ᴄᴀꜱᴇ</bold></#DB00CA>"
    # Per-case style overrides for SopDisplays (not saved in SopDisplays/data.yml):
    sopdisplays:
      type: TEXT
      base-scale: 1.0
      focus-scale: 1.0
      text-background-enabled: true
      text-background-color: "#44000000"
      text-shadowed: true
      text-line-width: 260
      text-see-through: true

  vip-only:
    enabled: true
    hideWhileSpinning: false
    offset:
      x: 0.0
      y: 2.35
      z: 0.0
    lines:
      - "<#35D6DE>VIP+ бонусы кейса</#35D6DE>"
    sopdisplays:
      type: TEXT
      text-shadowed: true
      conditions:
        type: any
        checks:
          - type: "has perm"
            input: "group.vip"
          - type: "has perm"
            input: "group.premium"
          - type: "has perm"
            input: "group.elite"
          - type: "has perm"
            input: "group.ultra"
          - type: "has perm"
            input: "group.supreme"

firework:
  offset:
    x: 0.0
    y: 0.7
    z: 0.0

open_commands: []

