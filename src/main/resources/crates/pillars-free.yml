displayName: "<#35D6DE>ᴄᴀꜱᴇ <#6944C1><bold>/ꜰʀᴇᴇ <color:#555555>(</color><color:#1A729E>%page%</color><color:#555555>/</color><color:#1A729E>%pages%</color><color:#555555>)</color>" #inventory

#if the player have no key
denyCommands:
  - "[console] abroadcast player %player_name% %acolor_<#EEDAB0>%❣ ###alocales_cases_message-need-key-1### %acolor_<#35D6DE>ᴄᴀꜱᴇ</#35D6DE> <#6944C1><bold>/ꜰʀᴇᴇ</bold></#6944C1><#EEDAB0> ###alocales_cases_message-need-key-2###</#EEDAB0>%"
denyPush: true

#if the case is already opening
denyOpeningCommands:
  - "[console] abroadcast player %player_name% %acolor_<#EEDAB0>%┃ &l###alocales_cases_message-already-opening###"
denyOpeningPush: false

key:
  name: "%acolor_<#35D6DE>%ᴄᴀꜱᴇ %acolor_<#6944C1>%&l/ꜰʀᴇᴇ &r%acolor_<#35D6DE>%ᴋᴇʏ"
  lore:
    - ""
    - "&7┃ ###alocales_cases_key-lore-1### %acolor_<#35D6DE>%ᴄᴀꜱᴇ %acolor_<#6944C1>%&l/ꜰʀᴇᴇ&7###alocales_cases_key-lore-2###"
    - ""
  item: TRIPWIRE_HOOK
  model: 1101

keyType: key
spin:
  duration: 5.0s
  offset:
    x: 0.0
    y: 0.95
    z: 0.0

hologram:
  enabled: false
  hideWhileSpinning: true
  offset:
    x: 0.0
    y: 1.85
    z: 0.0

firework:
  offset:
    x: 0.0
    y: 0.7
    z: 0.0

open_commands: []

