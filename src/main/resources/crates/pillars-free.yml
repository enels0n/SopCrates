        - "[console] lp user %player_name% permission set soppillars.cage.1 true pillars"
        - "[console] abroadcast all &7&l┃ &2&l%player_name% &6только что открыл %acolor_<#35D6DE>%ᴄᴀꜱᴇ %acolor_<#6944C1>%&l/ꜰʀᴇᴇ &6и получил оттуда &3Cage #1"
