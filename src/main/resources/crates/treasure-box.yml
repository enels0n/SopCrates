displayName: "<#00DB73><bold>ᴛʀᴇᴀꜱᴜʀᴇ ʙᴏx <color:#555555>(</color><color:#1A729E>%page%</color><color:#555555>/</color><color:#1A729E>%pages%</color><color:#555555>)</color>" #inventory

#if the player have no key
denyCommands:
  - "[console] abroadcast player %player_name% %acolor_<#EEDAB0>%❣ ###alocales_cases_message-need-key-1### %acolor_<#00DB73>%&lᴛʀᴇᴀꜱᴜʀᴇ ʙᴏx%acolor_<#EEDAB0>% ###alocales_cases_message-need-key-2###"
denyPush: true

#if the case is already opening
denyOpeningCommands:
  - "[console] abroadcast player %player_name% %acolor_<#EEDAB0>%┃ &l###alocales_cases_message-already-opening###"
denyOpeningPush: false

key:
  name: "<#00DB73><bold>ᴛʀᴇᴀꜱᴜʀᴇ ʙᴏx <#35D6DE>ᴋᴇʏ"
  lore:
    - ""
    - "&7┃ ###alocales_cases_key-lore-1### <#00DB73><bold>ᴛʀᴇᴀꜱᴜʀᴇ ʙᴏx&7###alocales_cases_key-lore-2###"
    - ""
  item: TRIPWIRE_HOOK
  model: 1102

keyType: key
spin:
  duration: 5.5s
  offset:
    x: 0.0
    y: 0.95
    z: 0.0

hologram:
  enabled: false
  hideWhileSpinning: true
  offset:
    x: 0.0
    y: 1.85
    z: 0.0

firework:
  offset:
    x: 0.0
    y: 0.7
    z: 0.0

open_commands: []

