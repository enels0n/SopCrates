# [minimessage] -> https://docs.advntr.dev/minimessage/format.html
# other formating -> https://github.com/Iridium-Development/IridiumColorAPI

prizes:
  '0':
    display:
      name: "%acolor_<#C8B3FF>%Cage #1"
      material: TUFF_BRICKS
    prize:
      commands:
        - "[console] lp user %player_name% permission set soppillars.cage.1 true pillars"
        - "[console] abroadcast all &7&l┃ &2&l%player_name% &6только что открыл %acolor_<#00DB73>%&lᴛʀᴇᴀꜱᴜʀᴇ ʙᴏx &6и получил оттуда &3Cage #1"
        - "[console] abroadcast player %player_name% &7&l┃ &6Чтобы установить косметику, используйте команду &6/cosmetics"
    weight: 4000
    checkAlternatives:
      - type: any
